<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact form states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#14302B}a:hover{color:#2C5A51}
input,textarea,button{font:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 640px; box-sizing: border-box; padding: 48px 40px; background: #14302B; font-family: 'Figtree', system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px">

  <div style="display: flex; flex-direction: column; gap: 14px">
    <p style="margin: 0; color: #C5D4CD; font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase">Sending</p>
    <form style="flex-grow: 1; padding: 28px; border-radius: 24px; background: #F1F4EE; color: #14302B; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 4px"><label for="s-name" style="font-weight: 600">Name</label><input id="s-name" type="text" value="Alex Rivera" disabled style="min-height: 44px; padding: 0 14px; border-radius: 14px; border: 1px solid #78927F; background: #FFFFFF; color: #3E5852"></div>
      <div style="display: flex; flex-direction: column; gap: 4px"><label for="s-email" style="font-weight: 600">Email</label><input id="s-email" type="email" value="alex@company.com" disabled style="min-height: 44px; padding: 0 14px; border-radius: 14px; border: 1px solid #78927F; background: #FFFFFF; color: #3E5852"></div>
      <div style="display: flex; flex-direction: column; gap: 4px"><label for="s-msg" style="font-weight: 600">Message</label><textarea id="s-msg" rows="3" disabled style="padding: 10px 14px; border-radius: 14px; border: 1px solid #78927F; background: #FFFFFF; color: #3E5852; resize: none">We’re looking for an interim CPO for Q1…</textarea></div>
      <button type="button" disabled aria-busy="true" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 28px; border: 0; border-radius: 999px; background: #F2B135; color: #14302B; font-weight: 700; opacity: 0.75; cursor: progress">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14302B" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9"></path></svg>Sending…</button>
    </form>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <p style="margin: 0; color: #C5D4CD; font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase">Sent</p>
    <div role="status" style="flex-grow: 1; padding: 28px; border-radius: 24px; background: #F1F4EE; color: #14302B; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px">
      <span style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; background: #F2B135"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#14302B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
      <h3 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 32px; line-height: 1.1">Thanks for reaching out</h3>
      <p style="margin: 0; color: #3E5852">I’ll get back to you shortly.</p>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <p style="margin: 0; color: #C5D4CD; font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase">Error</p>
    <form style="flex-grow: 1; padding: 28px; border-radius: 24px; background: #F1F4EE; color: #14302B; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 4px"><label for="e-name" style="font-weight: 600">Name</label><input id="e-name" type="text" value="Alex Rivera" style="min-height: 44px; padding: 0 14px; border-radius: 14px; border: 1px solid #78927F; background: #FFFFFF; color: #14302B"></div>
      <div style="display: flex; flex-direction: column; gap: 4px"><label for="e-email" style="font-weight: 600">Email</label><input id="e-email" type="email" value="alex@company.com" style="min-height: 44px; padding: 0 14px; border-radius: 14px; border: 1px solid #78927F; background: #FFFFFF; color: #14302B"></div>
      <div style="display: flex; flex-direction: column; gap: 4px"><label for="e-msg" style="font-weight: 600">Message</label><textarea id="e-msg" rows="3" style="padding: 10px 14px; border-radius: 14px; border: 1px solid #78927F; background: #FFFFFF; color: #14302B; resize: none">We’re looking for an interim CPO for Q1…</textarea></div>
      <p role="alert" style="margin: 0; display: flex; align-items: flex-start; gap: 10px; color: #B3261E; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: 0 0 20px; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg><span>Something went wrong. Please email me directly at <a href="mailto:jeff@samitt.co" style="color: #B3261E">jeff@samitt.co</a>.</span></p>
      <button type="button" style="align-self: flex-start; min-height: 52px; padding: 0 28px; border: 0; border-radius: 999px; background: #F2B135; color: #14302B; font-weight: 700; cursor: pointer">Send message</button>
    </form>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":640}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
